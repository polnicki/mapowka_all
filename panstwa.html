<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GeoQuiz Państwa i Stolice – Mapa Geopolityczna</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Leaflet CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>
<div style="text-align:center; padding: 10px 0; background: rgba(255,255,255,0.8); margin-bottom: 10px; font-weight: bold; font-size: 1.1em; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    <a href="index.html" style="color: #0074D9; text-decoration: none; margin-right: 20px;">🏔️ GeoQuiz Fizyczny</a> | 
    <a href="panstwa.html" style="color: #FF4136; text-decoration: none; margin-left: 20px;">🌍 GeoQuiz Państwa i Stolice</a>
</div>
<h1 style="text-align:center; color:#FF4136;">GeoQuiz Państwa i Stolice – Mapa Geopolityczna</h1>
<div id="main">
    <div id="map"></div>
    <div id="sidebar">
        <div id="nameEntry">
            <label for="playerName">Imię gracza:</label>
            <input type="text" id="playerName" maxlength="32" list="disneyNames" placeholder="np. Elsa, Mikki, Vaiana...">
            <datalist id="disneyNames">
                <option value="Mikki Mouse">
                <option value="Minnie Mouse">
                <option value="Kaczor Donald">
                <option value="Głupi Głupek">
                <option value="Pluto">
                <option value="Elsa">
                <option value="Anna">
                <option value="Olaf">
                <option value="Vaiana (Moana)">
                <option value="Simba">
                <option value="Nala">
                <option value="Ariel">
                <option value="Bella">
                <option value="Kopciuszek">
                <option value="Śnieżka">
                <option value="Aurora">
                <option value="Pocahontas">
                <option value="Mulan">
                <option value="Rapunzel">
                <option value="Merida">
                <option value="Tiana">
                <option value="Raya">
                <option value="Mirabel">
                <option value="Luisa">
                <option value="Isabela">
                <option value="Buzz Lightyear">
                <option value="Woody">
                <option value="Dory">
                <option value="Nemo">
                <option value="Sulley">
                <option value="Mike Wazowski">
            </datalist>
            <button id="startBtn" style="background: linear-gradient(90deg, #FF4136 0%, #F7B32B 100%);">Start</button>
        </div>
        <div id="timer" style="display:none;">Twój czas: <span id="timeValue">0</span>s</div>
        <div class="lives" id="livesBox" style="display:none;">Życia: <span id="lives">15</span></div>
        <label id="showNamesLabel" style="display:none;">
            <input type="checkbox" id="showNames"> Pokazuj nazwy na mapie (czas x2)
        </label>
        <button id="nextBtn" style="margin-bottom:10px; display:none; background: linear-gradient(90deg, #FF4136 0%, #F7B32B 100%);">DALEJ</button>
        <ul id="tasklist"></ul>
        <div id="msg"></div>
        <button id="endNow" style="display:none;">Zakończ teraz i wyślij wynik</button>
        <button id="restart" style="display:none;">Zagraj ponownie</button>
        <div id="ranking" style="display:none;">
            <h2>Najlepsze czasy i punkty</h2>
            <div id="rankingTable">Ładowanie...</div>
        </div>
        <div id="mapSelect" style="flex-direction:column; align-items:stretch; gap:10px; margin-bottom:12px;">
            <div>
                <label for="mapRegion">Kontynent:</label>
                <select id="mapRegion" style="width:100%; padding:6px; border-radius:8px; border:1px solid #c2e9fb; margin-top:4px;">
                    <option value="europa">Europa</option>
                    <option value="azja">Azja</option>
                    <option value="afryka">Afryka</option>
                    <option value="ameryka-pn">Ameryka Północna</option>
                    <option value="ameryka-pd">Ameryka Południowa</option>
                    <option value="australia">Australia i Oceania</option>
                    <option value="swiat">Świat (wybrane)</option>
                    <option value="sprawdzian">Sprawdzian (ze stolicami)</option>
                </select>
            </div>
            <div>
                <label for="quizMode">Tryb zadania:</label>
                <select id="quizMode" style="width:100%; padding:6px; border-radius:8px; border:1px solid #c2e9fb; margin-top:4px;">
                    <option value="panstwa">🏳️ Zgadywanie Państw</option>
                    <option value="stolice">⭐ Zgadywanie Stolic</option>
                    <option value="miks">🌐 Miks (Państwa i Stolice)</option>
                </select>
            </div>
            <div>
                <label for="mapVersion">Wersja:</label>
                <select id="mapVersion" style="width:100%; padding:6px; border-radius:8px; border:1px solid #c2e9fb; margin-top:4px;">
                    <option value="basic">Podstawowa</option>
                    <option value="ext">Rozszerzona</option>
                </select>
            </div>
        </div>
        <div id="currentScores" style="margin-top:12px; padding:12px; background:#f9faff; border-radius:12px; border:1px solid #c2e9fb;">
            <h3 style="margin:0 0 8px 0; font-size:1em; color:#0074D9;">🏆 Najlepsze wyniki (ta konfiguracja)</h3>
            <div id="currentScoresTable">Ładowanie...</div>
        </div>
        <div id="animSelectBox" style="margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; font-size:0.95em;">
            <label for="animTypeSelect" style="font-size:0.92em; font-weight:600; color:#FF4136;">Efekt trafienia:</label>
            <select id="animTypeSelect" style="border-radius:8px; border:1px solid #c2e9fb; padding:4px 8px; font-size:0.9em; background:#f9faff; color:#FF4136; font-weight:600; cursor:pointer;">
                <option value="random">🎲 Losowo (wszystkie)</option>
                <option value="shatter">💥 Rozpad na kawałki</option>
                <option value="pop">🎈 Komiczny balonik</option>
                <option value="vortex">🌀 Zwariowany wir</option>
                <option value="rocket">🚀 Wystrzał w kosmos</option>
                <option value="splat">🥞 Skok i plask</option>
                <option value="ghost">👻 Duszek</option>
            </select>
        </div>
    </div>
</div>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/icons.js"></script>
<script src="js/panstwa.js"></script>
</body>
</html>
